name: build-executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: grafocodigo-windows
          - os: macos-latest
            artifact: grafocodigo-macos
          - os: ubuntu-latest
            artifact: grafocodigo-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas gráficas no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Instalar projeto
        run: python -m pip install -e ".[test,build]"

      - name: Executar testes
        run: pytest -m "not browser"

      - name: Gerar executável do Windows
        if: runner.os == 'Windows'
        run: pyinstaller --clean --onefile --noconsole --name GrafoCodigo app_gui.py

      - name: Compactar executável do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GrafoCodigo.exe -DestinationPath GrafoCodigo-Windows-x64.zip

      - name: Gerar aplicativo do macOS
        if: runner.os == 'macOS'
        run: pyinstaller --clean --windowed --name GrafoCodigo app_gui.py

      - name: Compactar aplicativo do macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/GrafoCodigo.app GrafoCodigo-macOS.zip

      - name: Gerar executável do Linux
        if: runner.os == 'Linux'
        run: pyinstaller --clean --onefile --noconsole --name GrafoCodigo app_gui.py

      - name: Testar janela no Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          timeout 5s xvfb-run -a dist/GrafoCodigo || status=$?
          test "$status" -eq 124

      - name: Compactar executável do Linux
        if: runner.os == 'Linux'
        run: tar -czf GrafoCodigo-Linux-x64.tar.gz -C dist GrafoCodigo

      - name: Salvar aplicativos
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: GrafoCodigo-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar aplicativos
        uses: actions/download-artifact@v6
        with:
          pattern: grafocodigo-*
          merge-multiple: true
          path: release

      - name: Criar checksums
        run: cd release && sha256sum GrafoCodigo-* > SHA256SUMS.txt

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "GrafoCódigo $GITHUB_REF_NAME"
