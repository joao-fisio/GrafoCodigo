name: build-executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: grafocodigo-windows
          - os: macos-latest
            artifact: grafocodigo-macos
          - os: ubuntu-latest
            artifact: grafocodigo-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -e ".[test,build]"
      - run: pytest -m "not browser"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: pyinstaller --clean --onefile --noconsole --name GrafoCodigo app_gui.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GrafoCodigo.exe -DestinationPath GrafoCodigo-Windows-x64.zip

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: pyinstaller --clean --windowed --name GrafoCodigo app_gui.py
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/GrafoCodigo.app GrafoCodigo-macOS.zip

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: pyinstaller --clean --onefile --noconsole --name GrafoCodigo app_gui.py
      - name: Smoke test Linux window
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          timeout 5s xvfb-run -a dist/GrafoCodigo || status=$?
          test "$status" -eq 124
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf GrafoCodigo-Linux-x64.tar.gz -C dist GrafoCodigo

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: GrafoCodigo-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grafocodigo-*
          merge-multiple: true
          path: release
      - name: Create checksums
        run: cd release && sha256sum GrafoCodigo-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "GrafoCódigo $GITHUB_REF_NAME"
